services:
  reviewlens:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_PATH: /app/data/reviewlens.db
    volumes:
      - reviewlens-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
volumes:
  reviewlens-data:
